name: mapmythoughts

# Everything runs on this computer. Only the web container publishes a port, and only on 127.0.0.1.
# Settings come from an optional .env file next to this one; see .env.example.
x-db-env: &db-env
  POSTGRES_USER: ${MMT_DB:-mapmythoughts}
  # internal network only; Postgres is never published to the host
  POSTGRES_PASSWORD: ${MMT_DB:-mapmythoughts}
  POSTGRES_DB: ${MMT_DB:-mapmythoughts}

services:
  db:
    image: postgres:18.6-alpine
    environment: *db-env
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m

  sync:
    build:
      context: .
      dockerfile: docker/sync.Dockerfile
    environment:
      DATABASE_URL: postgres://${MMT_DB:-mapmythoughts}:${MMT_DB:-mapmythoughts}@db:5432/${MMT_DB:-mapmythoughts}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - '127.0.0.1:${MMT_PORT:-8080}:80'
    depends_on:
      - sync
    restart: unless-stopped
    mem_limit: 128m

  # Takes a compressed SQL dump into the backup folder (outside Docker) when the newest one is
  # older than a day, and keeps 14 days of dumps.
  backup:
    image: postgres:18.6-alpine
    environment:
      <<: *db-env
      PGHOST: db
      PGPASSWORD: ${MMT_DB:-mapmythoughts}
      KEEP_DAYS: '14'
    entrypoint: ['/bin/sh', '/backup-loop.sh']
    volumes:
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
      - ${MMT_BACKUP_DIR:-${HOME}/MapMyThoughts-backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m

volumes:
  pgdata:
    name: ${MMT_DB_VOLUME:-mapmythoughts-pgdata}
